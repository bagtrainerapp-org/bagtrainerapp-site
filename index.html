<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BagTrainer</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="page">
  <a class="brand" href="/">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="var(--accent-ink)"/>
      </svg>
    </div>
    <div class="brand-name">BAG<span class="lime">TRAINER</span></div>
  </a>

  <h1>BagTrainer</h1>
  <p class="lede">Audio-guided Muay Thai, Boxing and Kickboxing workouts. Policies and account information below.</p>

  <div class="hub-links">
    <a class="hub-link" href="/privacy">
      <div>
        <div class="hub-link-title">Privacy Policy</div>
        <div class="hub-link-sub">How your data is handled</div>
      </div>
      <span class="hub-link-arrow">&rsaquo;</span>
    </a>

    <a class="hub-link" href="/terms">
      <div>
        <div class="hub-link-title">Terms of Use</div>
        <div class="hub-link-sub">Subscription and app usage terms</div>
      </div>
      <span class="hub-link-arrow">&rsaquo;</span>
    </a>

    <a class="hub-link" href="/delete-account">
      <div>
        <div class="hub-link-title">Delete Account</div>
        <div class="hub-link-sub">Request permanent account deletion</div>
      </div>
      <span class="hub-link-arrow">&rsaquo;</span>
    </a>
  </div>

  <footer>BagTrainer &middot; bagtrainerapp@gmail.com</footer>
</div>
</body>
</html>
